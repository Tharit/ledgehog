[project]
name = "ledgehog"
version = "0.3.0"
description = "Household ledger"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13",
    "argon2-cffi>=25.1.0",
    "authlib>=1.9.1",
    "fastapi>=0.115",
    "fints==5.0.1",
    "httpx2>=2.16.0",
    "joserfc>=1.7.7",
    "mt-940==5.1.1",
    "psycopg[binary]>=3.2",
    "pypdfium2>=4.30",
    "python-calamine>=0.9.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "hypothesis>=6.100",
    "import-linter>=2.0",
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.uv]
no-build = true
exclude-newer = "7 days"
# The project's own editable install is the one build uv still runs (no-build exempts first-party
# sources); pin its backend and the backend's dependencies so that build is repeatable.
build-constraint-dependencies = [
    "hatchling==1.32.4",
    "packaging==26.3",
    "pathspec==1.1.1",
    "pluggy==1.7.0",
    "tomlkit==0.15.2",
    "trove-classifiers==2026.9.21.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DTZ"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["DTZ"]
"migrations/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]
mypy_path = "."
explicit_package_bases = true

# python-fints and requests ship no type information; the FinTS plugin is their only user, behind
# its own typed seam (app/plugins/importers/fints/bank.py).
[[tool.mypy.overrides]]
module = ["fints", "fints.*", "requests"]
ignore_missing_imports = true

# pypdfium2 ships no type information; the email importer's pdf.py is its only user.
[[tool.mypy.overrides]]
module = ["pypdfium2", "pypdfium2.*"]
ignore_missing_imports = true

# Authlib ships no type information; utils/auth/oidc.py is its only user.
[[tool.mypy.overrides]]
module = ["authlib", "authlib.*"]
ignore_missing_imports = true
